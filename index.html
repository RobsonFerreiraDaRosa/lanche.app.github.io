<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pedidos Online Tribo</title>

<style>
body { font-family: Arial, Helvetica, sans-serif; background:#f5f5f5; margin:0; padding:0; }
h2 { margin-top:16.6px; padding:0px 8px; font-weight:normal; font-size:16px; }
.categoria { margin-bottom:16.6px; }
.cardapio { display:grid; grid-template-columns: repeat(auto-fit,minmax(260px,1fr)); gap:15px; }
.item { background:#fff; border-radius:8px; padding:10px 12px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
.item-header { display:flex; justify-content:space-between; align-items:center; }
.item h3 { margin:0; font-weight:normal; font-size:16px; }
.desc { font-size:13px; color:#555; margin:6px 0; }
.preco { color:#1faa00; font-size:16px; }
.qtd { display:flex; align-items:center; border:1px solid #ddd; border-radius:6px; overflow:hidden; }
.qtd button { width:36px; height:36px; border:none; font-size:20px; font-weight:bold; background:#f5f5f5; cursor:pointer; }
.qtd .menos { color:#d32f2f; }
.qtd .mais { color:#2e7d32; }
.qtd span { width:36px; text-align:center; font-size:15px; background:#fff; border-left:1px solid #ddd; border-right:1px solid #ddd; }
.add { background:#25d366; color:#fff; border:none; padding:8px 14px; border-radius:5px; font-size:14px; }
#carrinho { background:#fff; margin-top:30px; padding:15px; border-radius:8px; font-size:16px; }
ul { list-style:none; padding:0; }
#lista li { border-bottom:1px solid #eee; padding:10px 0; }
.linha-carrinho { display:flex; justify-content:space-between; align-items:center; }
.remover { background:#d32f2f; color:#fff; border:none; border-radius:5px; width:28px; height:28px; font-size:16px; cursor:pointer; }
.obs-carrinho input { width:100%; padding:6px; margin-top:6px; font-size:14px; }
.pagamento-opcao { border:1px solid #ddd; border-radius:6px; padding:10px; margin-bottom:8px; cursor:pointer; transition:.2s; }
.pagamento-opcao.selecionado { background:#d32f2f; color:#fff; border-color:#d32f2f; }
.pix-chave { font-size:13px; margin-top:6px; word-break:break-all; }
#finalizar { background:#128c7e; color:#fff; padding:12px; border:none; width:100%; border-radius:6px; font-size:16px; }
#btnPagar { background:#25d366; color:#fff; border:none; width:100%; padding:12px; border-radius:6px; font-size:16px; margin:10px 0; display:none; }
#btnEditar { background:#ff9800; color:#fff; border:none; width:100%; padding:10px; border-radius:6px; font-size:14px; margin-bottom:10px; display:none; }
.topo{ background:#000; color:#fff; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:1000; padding:0px 12px; }
.logo{width:48px;height:48px;border-radius:12px;object-fit:cover}
.titulo{font-size:18px;font-weight:600}
.linha-preco{display:flex;justify-content:space-between;margin-top:6px}
</style>
</head>

<body>

<header class="topo">
  <img src="logo.png" class="logo">
  <span class="titulo">TRIBO BAR</span>
</header>

<div style="padding:10px 12px; display:flex; gap:8px;">
  <input id="telefone" type="tel" placeholder="DDD + Celular" maxlength="11" style="flex:1; padding:8px;">
  <input id="nomeCliente" type="text" placeholder="Nome" style="flex:1; padding:8px;">
</div>

<div id="menu"></div>

<div id="carrinho">
  <h2>🛒 Seu Pedido</h2>
  <ul id="lista"></ul>
  <p><strong>Total:</strong> R$ <span id="total">0.00</span></p>

  <button id="btnPagar">Pagar</button>
  <button id="btnEditar">Editar Carrinho</button>

  <h2>Forma de Pagamento</h2>
  <div id="pagamentos"></div>

  <button id="finalizar">Enviar pedido no WhatsApp</button>
</div>

<script>
const STORAGE_KEY='carrinho_tribo';
const STATE_KEY='estado_tribo';

let carrinho=JSON.parse(localStorage.getItem(STORAGE_KEY))||[];
let estado=JSON.parse(localStorage.getItem(STATE_KEY))||{bloqueado:false,pagamento:null};
let carrinhoBloqueado=estado.bloqueado;
let pagamentoSelecionado=estado.pagamento;

function salvar(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(carrinho));
  localStorage.setItem(STATE_KEY,JSON.stringify({bloqueado:carrinhoBloqueado,pagamento:pagamentoSelecionado}));
}

const pagamentos={
  dinheiro:{titulo:'DINHEIRO',mensagem:'Selecionando pagamento em dinheiro, seu pedido só estará garantido após pagamento presencial no caixa'},
  pix:{titulo:'PIX',mensagem:'Favor realizar o pagamento via PIX antes de enviar o pedido'}
};

function gerarPix(chave,valor){
  return `00020126360014BR.GOV.BCB.PIX01${chave.length}${chave}52040000530398654${valor.toFixed(2).replace('.','').length}${valor.toFixed(2).replace('.','')}5802BR5909TRIBO BAR6008LAJEADO62070503***`;
}

const menu={
  Salgados:[
    {nome:'Mini Pizza Frango',preco:13,desc:'Molho, frango, cebola e mussarela',obs:true},
    {nome:'Mini Pizza Strogonoff Carne',preco:13,desc:'Molho, carne, mussarela',obs:false}
  ],
  Doces:[
    {nome:'Mini Pizza Chocolate Preto',preco:13,desc:'Chocolate ao Leite',obs:false},
    {nome:'Mini Pizza Chocolate Branco',preco:13,desc:'Chocolate Branco',obs:false}
  ],
  Bebidas:[
    {nome:'Pitchulinha Fruki Guaraná 200ml',preco:2.5,desc:'Guaraná 200ml',obs:false},
    {nome:'Pitchulinha Coca-Cola Zero 200ml',preco:2.5,desc:'Coca Zero 200ml',obs:false},
    {nome:'Pitchulinha Coca-Cola 200ml',preco:2.5,desc:'Coca 200ml',obs:false}
  ]
};

const menuDiv=document.getElementById('menu');

Object.keys(menu).forEach(cat=>{
  const b=document.createElement('div');
  b.className='categoria';
  b.innerHTML=`<h2>${cat}</h2>`;
  const g=document.createElement('div');
  g.className='cardapio';

  menu[cat].forEach(item=>{
    let q=0;
    const d=document.createElement('div');
    d.className='item';
    d.innerHTML=`
      <div class="item-header">
        <h3>${item.nome}</h3>
        <div class="qtd">
          <button class="menos" style="display:none">−</button>
          <span>0</span>
          <button class="mais">+</button>
        </div>
      </div>
      <div class="desc">${item.desc}</div>
      <div class="linha-preco">
        <div class="preco">R$ ${item.preco.toFixed(2)}</div>
        <button class="add">Adicionar</button>
      </div>`;

    const s=d.querySelector('span'),m=d.querySelector('.menos');
    d.querySelector('.mais').onclick=()=>{ if(carrinhoBloqueado)return; q++; s.textContent=q; m.style.display='inline-block'; };
    m.onclick=()=>{ if(carrinhoBloqueado)return; if(q>0)q--; s.textContent=q; if(q===0)m.style.display='none'; };
    d.querySelector('.add').onclick=()=>{
      if(!q||carrinhoBloqueado)return;
      carrinho.push({nome:item.nome,preco:item.preco,qtd:q,obs:item.obs?'':null});
      salvar(); q=0; s.textContent=0; m.style.display='none'; atualizar();
    };
    g.appendChild(d);
  });
  b.appendChild(g);
  menuDiv.appendChild(b);
});

const lista=document.getElementById('lista');
const totalSpan=document.getElementById('total');
const btnPagar=document.getElementById('btnPagar');
const btnEditar=document.getElementById('btnEditar');
const pagamentosDiv=document.getElementById('pagamentos');

function atualizar(){
  lista.innerHTML='';
  let t=0;
  carrinho.forEach((i,x)=>{
    t+=i.preco*i.qtd;
    lista.innerHTML+=`
      <li>
        <div class="linha-carrinho">
          ${i.qtd}x ${i.nome}
          ${!carrinhoBloqueado?`<button class="remover" onclick="carrinho.splice(${x},1);salvar();atualizar()">X</button>`:''}
        </div>
        ${i.obs!==null?`
        <div class="obs-carrinho">
          <input maxlength="48" placeholder="Observação" ${carrinhoBloqueado?'disabled':''}
            value="${i.obs}" oninput="carrinho[${x}].obs=this.value;salvar()">
        </div>`:''}
      </li>`;
  });
  totalSpan.textContent=t.toFixed(2);
  btnPagar.style.display=carrinho.length&&!carrinhoBloqueado?'block':'none';
  btnEditar.style.display=carrinhoBloqueado?'block':'none';
}
atualizar();

btnPagar.onclick=()=>{ carrinhoBloqueado=true; salvar(); renderPag(); atualizar(); };
btnEditar.onclick=()=>{ carrinhoBloqueado=false; pagamentoSelecionado=null; salvar(); renderPag(); atualizar(); };

function renderPag(){
  pagamentosDiv.innerHTML='';
  if(!carrinhoBloqueado)return;
  Object.keys(pagamentos).forEach(k=>{
    const p=pagamentos[k];
    const d=document.createElement('div');
    d.className='pagamento-opcao'+(pagamentoSelecionado===k?' selecionado':'');
    d.onclick=()=>{ pagamentoSelecionado=pagamentoSelecionado===k?null:k; salvar(); renderPag(); };
    let html=`<strong>${p.titulo}</strong><div>${p.mensagem}</div>`;
    if(k==='pix'&&pagamentoSelecionado==='pix'){
      const pix=gerarPix('5591981894966',parseFloat(totalSpan.textContent));
      html+=`<div class="pix-chave"><strong>PIX Copia e Cola:</strong><br>${pix}</div>`;
    }
    d.innerHTML=html;
    pagamentosDiv.appendChild(d);
  });
}
renderPag();

document.getElementById('finalizar').onclick=()=>{
  const tel=document.getElementById('telefone').value;
  if(!/^\d{11}$/.test(tel)){ alert('Informe o telefone com DDD e 9 dígitos'); return; }
  if(!pagamentoSelecionado){ alert('Selecione a forma de pagamento'); return; }

  let msg=`📞 ${tel}\n👤 ${document.getElementById('nomeCliente').value}\n\n🧾 *NOVO PEDIDO*\n\n`;
  carrinho.forEach(i=>{ msg+=`${i.qtd}x ${i.nome}${i.obs?'\nObs: '+i.obs:''}\n`; });
  msg+=`\nPagamento: ${pagamentos[pagamentoSelecionado].titulo}\nTotal: R$ ${totalSpan.textContent}`;

  window.open('https://wa.me/5551981894966?text='+encodeURIComponent(msg));

  carrinho=[]; carrinhoBloqueado=false; pagamentoSelecionado=null;
  localStorage.clear(); atualizar(); renderPag();
};
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Pedidos Online Tribo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">
    <header class="topo">
        <img src="logo.png" alt="Tribo Bar Logo" class="logo">
        <span class="titulo">TRIBO BAR</span>
    </header>

    <div class="inputs-container">
        <div class="inputs-grid">
            <input id="telefone" type="tel" placeholder="(99) 99999-9999" maxlength="15" inputmode="numeric">
            <input id="nomeCliente" type="text" placeholder="Nome completo">
        </div>
    </div>

    <div class="layout">
        <div id="menu"></div>
        
        <div id="carrinho">
            <h2>Seu Pedido</h2>
            <ul id="lista"></ul>
            <p class="mt-2"><strong>Total:</strong> R$ <span id="total">0.00</span></p>

            <button id="btnPagar" class="botao">Pagar</button>
            <button id="btnEditar" class="botao">Editar Carrinho</button>

            <h2 class="mt-3">Forma de Pagamento</h2>
            <div id="pagamentos"></div>

            <button id="finalizar" class="botao">Enviar pedido no WhatsApp</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
